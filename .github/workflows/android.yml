name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Z80-Pocket-IDE-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # Publish only successful builds from the default branch, never PR builds.
  # A unique tag per build means immutable-release repositories are supported
  # and the downloadable asset always corresponds to its exact commit.
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: z80-pocket-ide-apk-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: Z80-Pocket-IDE-debug
          path: dist
      - name: Prepare release files
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          test -n "$version"
          test -s dist/app-debug.apk
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mv dist/app-debug.apk dist/Z80-Pocket-IDE.apk
          (cd dist && sha256sum Z80-Pocket-IDE.apk > Z80-Pocket-IDE.apk.sha256)
          printf 'Automatically built from the main branch at commit `%s`.\n\n' "$GITHUB_SHA" > dist/RELEASE_NOTES.md
          printf 'This is a debug-signed Android APK for sideloading; it is not a Google Play production build.\n' >> dist/RELEASE_NOTES.md
      - name: Publish GitHub Release with APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "build-${{ github.run_number }}-${{ github.run_attempt }}" \
            dist/Z80-Pocket-IDE.apk \
            dist/Z80-Pocket-IDE.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Z80 Pocket IDE v${{ steps.metadata.outputs.version }} (build #${{ github.run_number }})" \
            --notes-file dist/RELEASE_NOTES.md \
            --latest
