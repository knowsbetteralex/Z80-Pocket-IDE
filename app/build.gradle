plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alexzab.z80pocketide'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.alexzab.z80pocketide'
        minSdk 23
        targetSdk 35
        versionCode 62
        versionName '0.49.0'
        buildConfigField 'String', 'BUILD_COMMIT', '"' + (System.getenv('GITHUB_SHA') ?: 'local') + '"'
        buildConfigField 'long', 'BUILD_NUMBER', (System.getenv('GITHUB_RUN_NUMBER') ?: '0') + 'L'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
