plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alexzab.z80pocketide'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.alexzab.z80pocketide'
        minSdk 23
        targetSdk 35
        versionCode 61
        versionName '0.48.0'
        buildConfigField 'String', 'BUILD_COMMIT', '"' + (System.getenv('GITHUB_SHA') ?: 'local') + '"'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
